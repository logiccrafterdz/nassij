name: Nassij CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with flake8
        run: |
          pip install flake8
          # Stop the build on critical errors (syntax errors, undefined names)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=.git,__pycache__,build,dist,*.egg-info,.venv,venv
          # Warnings only — non-blocking
          flake8 . --count --max-complexity=15 --max-line-length=120 --statistics \
            --exclude=.git,__pycache__,build,dist,*.egg-info,.venv,venv \
            --exit-zero

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -q

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: |
          pytest tests/ --cov=core --cov=utils --cov=integrity --cov-report=term-missing -q